name: Verify portfolio
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/evidence.py

      - run: python tools/benchmark.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Render UML and C4 source diagrams
        run: |
          curl --fail --location https://repo.maven.apache.org/maven2/net/sourceforge/plantuml/plantuml/1.2024.8/plantuml-1.2024.8.jar -o /tmp/plantuml.jar
          java -jar /tmp/plantuml.jar -tsvg docs/diagrams/*.puml
          mkdir -p reports/diagrams
          cp docs/diagrams/*.svg reports/diagrams/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-report
          path: reports/
